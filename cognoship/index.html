<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- always the dark theme: no theme button here (the lab keeps its own; page.js wires one only where the page has it) -->
<!-- ?phone=<device> (or 1) on its own (not in a frame): the phone test page shows this page in a phone-sized frame -->
<script>(function(){var p=new URLSearchParams(location.search).get('phone');if(p&&p!=='0'&&window.top===window)location.replace('phone.html'+location.search);})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Cognoship</title>
<meta name="description" content="Steer a Lenia creature by hiding parts of it from itself.">
<!-- Link previews (WhatsApp, iMessage, Slack, ...). og:image must be an absolute https URL. -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://chakazul.github.io/cognoship/">
<meta property="og:title" content="Cognoship">
<meta property="og:description" content="Steer a Lenia creature by hiding parts of it from itself.">
<meta property="og:image" content="https://chakazul.github.io/cognoship/assets/screenshot-cool.png">
<meta property="og:image:width" content="960">
<meta property="og:image:height" content="1267">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap game">
  <div class="title-row">
    <h1>Cognoship</h1>
    <nav class="modes" aria-label="Game mode">
      <a id="mode-story" href="./">Story</a>
      <a id="mode-challenge" href="?mode=challenge">Challenge</a>
      <a id="mode-sandbox" href="?mode=sandbox">Sandbox</a>
    </nav>
    <div class="icons">
      <button id="sound" class="icon" data-label="Music" aria-pressed="false" title="Background music on / off (M)" aria-label="Music">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </button>
      <button id="fullscreen" class="icon" title="Fullscreen" aria-label="Fullscreen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </div>

  <div class="screen">
    <div class="canvas-box">
      <canvas id="gl" width="1152" height="512"></canvas>
      <canvas id="ui" width="1152" height="512"></canvas>
      <!-- the overlays of each view, in a layer over it (style.css .layer: beside each other, or the
           world above the ship view in the stacked layout); their places are relative to their layer -->
      <div class="layer layer-world">
        <!-- the score (energy), at the top of the world view, centred, while the dots are on ([dot:<n>]) -->
        <div id="score" class="score" hidden><span id="score-v">0</span></div>
        <!-- challenge mode: the time left ([time_limit]), at the top left of the world view -->
        <div id="timer" class="timer" hidden></div>
        <!-- ?dev=1: test buttons at the top left of the world view (I, O, P), the frame rate at its top right -->
        <div id="dev-fps" class="dev-fps" hidden></div>
        <div id="dev" class="dev" hidden>
          <button id="dev-ch" title="Go to the next chapter (I)">Ch</button>
          <button id="dev-ok" title="Complete the waiting line's conditions (O)">Ok</button>
          <button id="dev-do" title="Score as if the ship ate a dot, +10 energy (P)">Do</button>
          <button id="dev-rc" title="Record the frame times (L): again to stop and download the summary">Rc</button>
        </div>
        <!-- the lower left corner of the world view, while the bullets are on ([bullet]); as X; Clear while drawing ([world_draw]) -->
        <!-- above Pulses (stacked: between Fire and Pulses), while the gun has two or more patterns ([bullet]): the previous / next one (C / V) -->
        <div id="bullet-nav" class="bullet-nav" hidden>
          <button id="bullet-prev" title="The previous pulse type (C)">&#9664;</button>
          <button id="bullet-next" title="The next pulse type (V)">&#9654;</button>
        </div>
        <button id="fire" class="fire" hidden title="Fire a pulse the way the ship moves (Z)"><span class="kt">Fire</span><span id="fire-id" class="fire-id" hidden></span></button>
        <!-- right of Fire ([gun] on, the ship lost too): opens the bullet book (the stacked layout: below Fire and < >) -->
        <button id="bullets" class="world-bullets" hidden title="The pulse book: choose the pulse to fire (X)">Pulses</button>
        <!-- the world view's lower right ([settings:on]): opens the settings book -->
        <button id="settings" class="world-settings" hidden title="Settings">Settings</button>
        <!-- world draw (game.js fieldMode): the brush in use, at the world view's top, below the energy -->
        <div id="field-tool" class="tool-name field-tool" hidden></div>
      </div>
      <div class="layer layer-ship">
        <!-- the ship view's upper centre, between Morphs and Species: the tool the R G B patches use on the ship
             (Masking / Drawing / Erasing; not while drawing on the world) -->
        <div id="ship-tool" class="tool-name ship-tool" hidden></div>
        <!-- in the ship view, along its bottom edge (the lab has the action patches there) -->
        <div class="ship-ctl">
          <button id="headup" aria-pressed="false" title="Upward: rotate the ship view so the creature's heading points up (E toggles)">Upward</button>
          <!-- world draw (game.js fieldMode): Upward reads Undo, Zoom reads Width (the brush's) -->
          <label title="Zoom of the ship view, in screen px per cell (R out, T in)"><span id="zoom-name">Zoom</span> <input id="zoom" type="range" min="2" max="6" step="1"></label>
        </div>
        <!-- in the ship view, at its upper left ([morph_book:on]): opens the morph book -->
        <button id="morphs" class="ship-morphs" hidden title="The morph book: the morphs you have discovered (S)">Morphs</button>
        <!-- in the ship view, at its upper right, level with Morphs, in sandbox and challenge modes: opens the species / challenge book -->
        <button id="species" class="ship-species" hidden title="The species book: choose a species (D)">Species</button>
        <!-- below Morphs while a clone is held ([clone:on]): turn it 45 degrees clockwise, flip it; paste it
             where a touch placed it (only then), cancel it -->
        <div id="clone-tools" class="clone-tools" hidden>
          <button id="clone-flip" title="Flip the clone left to right (F)">&#8596;</button>
          <button id="clone-rot" title="Turn the clone 45 degrees clockwise (G)">&#8635;</button>
          <button id="clone-cancel" title="Cancel the clone (Esc)">&#10007;</button>
          <button id="clone-ok" title="Paste the clone where it is placed (Enter)" hidden>&#10003;</button>
        </div>
        <!-- the stacked layout: ?dev=1's buttons and stats, left of the ship view at its top, in a column
             (game.js applyLayout moves #dev and #dev-fps in here, and back) -->
        <div id="dev-col" class="dev-col"></div>
        <!-- in the ship view, between "Dissolved" and Upward / Zoom, when the world needs a reset (everything dissolved) -->
        <div class="ship-dead">
          <button id="reset" class="major" hidden title="Start again with your morph (A)"><span class="kt">Respawn</span></button>
          <button id="morphs-dead" class="major" hidden title="Choose a morph to start again with (S)"><span class="kt">Choose</span></button>
        </div>
      </div>
      <!-- the morph book, over the whole game window; a click outside the box closes it -->
      <div id="book" class="book" hidden>
        <div class="book-box" role="dialog" aria-label="Morph book">
          <h2 id="book-title">Dissolve to respawn</h2>
          <div class="book-grid" id="book-grid"></div>
          <!-- the settings book (above Close) ([settings:on], the Settings button), three rows:
               World: Normal / Centered (the ordinary world rolled to keep the ship in the middle) / Infinite (a
               scrolling world, [clear_world:scroll]); Objects (how many other creatures to keep, [min_morph:<n>]).
               Hostile: Behavior (None: still; Auto: fire at you; Balanced, Aggressive: steer and fire by the morph model); Morphs
               (how many bots to keep, [min_hostile:<n>]); Pulses (the pulse type they fire).
               Player: Behavior (None: you steer; Auto: fires by itself; Balanced, Aggressive: steers and fires by itself, by the
               morph model, behaviors.js); Autospawn (Respawn by itself once dissolved). -->
          <div id="book-settings" class="book-settings" hidden>
            <div class="set-row">
            <span class="set-head">World</span>
            <button id="world" aria-pressed="false" title="World: Normal (the ordinary world); Centered (the same world, rolled round so your ship stays in the middle of the world view); Infinite (a scrolling world that follows your ship; the world starts afresh as the book closes)">Normal</button>
            <label title="Objects: keep at least this many other (not hostile) creatures in the world (a species chosen, or now)">Objects <input id="objects" type="range" min="0" max="6" step="1"><output id="objects-v"></output></label>
            </div>
            <div class="set-row">
            <span class="set-head">Hostile</span>
            <button id="hostile-behavior" aria-pressed="false" title="The hostile creatures' behavior: None (they drift and never fire); Auto (they drift and fire at your ship); by the morph model, steering and firing along their motion when lined up: Balanced (as limus or gyrans of Aquarium originale: attacks within reach, turns and escapes when too near, rests as gyrans once safely away, then attacks again); Aggressive (as limus or gyrans of Aquarium originale: attacks from anywhere, turns away only when very near and briefly, never rests). As other morphs they drift and never fire (no direct shots)">Behavior: Auto</button>
            <label title="Morphs: keep at least this many hostile creatures in the world (a species chosen, or now)">Morphs <input id="hostiles" type="range" min="0" max="6" step="1"><output id="hostiles-v"></output></label>
            <button id="hostile-pulses" title="Pulses: the pulse type the hostile creatures fire">Pulses</button>
            </div>
            <div class="set-row">
            <span class="set-head">Player</span>
            <button id="player-behavior" aria-pressed="false" title="Your ship's behavior: None (you steer and fire); Auto (it fires by itself at the nearest hostile creature, or with none, the nearest other creature); an autopilot by the morph model going for the nearest hostile creature, steering and firing along its motion when lined up: Balanced (as limus or gyrans of Aquarium originale: attacks within reach, turns and escapes when too near, rests as gyrans once safely away, then attacks again); Aggressive (as limus or gyrans of Aquarium originale: attacks from anywhere, turns away only when very near and briefly, never rests). As other morphs or ???, nothing">Behavior: None</button>
            <button id="autospawn" aria-pressed="false" title="Autospawn: once your ship has dissolved, Respawn by itself after a second">Autospawn</button>
            </div>
          </div>
          <button id="book-close">Close</button>
          <div id="book-species" class="book-species" hidden></div>
          <!-- sandbox mode: held for 3 s, clears the central inventory -->
          <div id="book-clear" class="book-clear" hidden title="Hold for 3 seconds to clear every discovered morph and pulse, and the energy, from every run">Hold to clear data</div>
        </div>
      </div>
      <!-- "SUCCESS", centred over the game window when a line's [need] conditions are met, fading out -->
      <div id="success" class="success" hidden><div class="success-box">SUCCESS</div></div>
      <!-- a chapter's title card ([chapter]), over the whole game window -->
      <div id="chapter" class="chapter" hidden>
        <div class="chapter-box"><div class="chapter-no" id="chapter-no"></div><div class="chapter-title" id="chapter-title"></div><div class="chapter-no chapter-stage" id="chapter-stage" hidden></div></div>
      </div>
      <div id="error" class="error" hidden></div>
    </div>
  </div>
  <!-- under the screen: the message area (under the world view), the controls (under the ship view) -->
  <div class="below">
    <div class="msg" id="msg" aria-live="polite"></div>
    <div class="controls">
      <button id="restart" title="Retry the scene: redo the script from its last checkpoint ([chapter] or [new_scene]) to here (Backspace)">Retry</button>
      <button id="play" aria-pressed="false" title="Pause / play (Enter)">Pause</button>
      <label title="Simulation speed (Q slower, W faster)">Speed <input id="speed" type="range" min="1" max="7" step="1"></label>
    </div>
  </div>
</div>
<button id="fs-exit" class="fs-exit icon" title="Exit fullscreen" aria-label="Exit fullscreen">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
</button>

<script src="rule.js"></script>
<script src="aquarium233.js"></script>
<script src="species.js"></script>
<script src="creatures.js"></script>
<script src="glsim.js"></script>
<script src="fftsim.js"></script>   <!-- FFT mode, on by default (a plug-in; ?fft=0: off, the direct convolution) -->
<script src="statschart.js"></script>
<script src="detect.js"></script>
<script src="page.js"></script>
<script src="core.js"></script>
<script src="dots.js"></script>
<script src="bullet_patterns.js"></script>
<script src="bullets.js"></script>
<script src="field.js"></script>
<script src="clone.js"></script>
<script src="models.js"></script>
<script src="behaviors.js"></script>
<script src="game.js"></script>
</body>
</html>
