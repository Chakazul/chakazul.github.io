<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>try{if(localStorage.getItem('cognoship-theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Cognoship</title>
<meta name="description" content="Steer a Lenia creature by hiding parts of it from itself.">
<!-- Link previews (WhatsApp, iMessage, Slack, ...). og:image must be an absolute https URL. -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://chakazul.github.io/cognoship/">
<meta property="og:title" content="Cognoship">
<meta property="og:description" content="Steer a Lenia creature by hiding parts of it from itself.">
<meta property="og:image" content="https://chakazul.github.io/cognoship/assets/screenshot-cool.png">
<meta property="og:image:width" content="960">
<meta property="og:image:height" content="1267">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap game">
  <div class="title-row">
    <h1>Cognoship</h1>
    <nav class="modes" aria-label="Game mode">
      <a id="mode-story" href="./">Story Mode</a>
      <a id="mode-sandbox" href="?mode=sandbox">Sandbox Mode</a>
    </nav>
    <div class="icons">
      <button id="sound" class="icon" data-label="Music" aria-pressed="false" title="Background music on / off (M)" aria-label="Music">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </button>
      <button id="theme" class="icon" title="Light / dark page" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button id="fullscreen" class="icon" title="Fullscreen" aria-label="Fullscreen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </div>

  <div class="screen">
    <div class="canvas-box">
      <canvas id="gl" width="1152" height="512"></canvas>
      <canvas id="ui" width="1152" height="512"></canvas>
      <!-- the score (energy), at the top of the world view, centred, while the dots are on ([dot:<n>]) -->
      <div id="score" class="score" hidden><span id="score-v">0</span></div>
      <!-- ?dev=1: test buttons at the top left of the world view (I, O, P), the frame rate at its top right -->
      <div id="dev-fps" class="dev-fps" hidden></div>
      <div id="dev" class="dev" hidden>
        <button id="dev-ch" title="Go to the next chapter (I)">Ch</button>
        <button id="dev-ok" title="Complete the waiting line's conditions (O)">Ok</button>
        <button id="dev-do" title="Score as if the ship ate a dot, +10 energy (P)">Do</button>
      </div>
      <!-- in the ship view, along its bottom edge (the lab has the action patches there) -->
      <div class="ship-ctl">
        <button id="headup" aria-pressed="false" title="Upward: rotate the ship view so the creature's heading points up (E toggles)">Upward</button>
        <label title="Zoom of the ship view, in screen px per cell (R out, T in)">Zoom <input id="zoom" type="range" min="2" max="6" step="1"></label>
      </div>
      <!-- in the ship view, right of the name box ([morph_book:on]): opens the morph book -->
      <!-- in the ship view, left of the name box, mirroring Morphs ([gun] on): opens the bullet book -->
      <button id="bullets" class="ship-bullets" hidden title="The bullet book: choose the bullet to fire (S)">Bullets</button>
      <button id="morphs" class="ship-morphs" hidden title="The morph book: the morphs you have discovered (X)">Morphs</button>
      <!-- in the ship view, between Bullets and Morphs, in sandbox mode only: opens the species book -->
      <button id="species" class="ship-species" hidden title="The species book: choose a species (C)">Species</button>
      <!-- below Morphs while a clone is held ([clone:on]): turn it 45 degrees clockwise, flip it; paste it
           where a touch placed it (only then), cancel it -->
      <div id="clone-tools" class="clone-tools" hidden>
        <button id="clone-rot" title="Turn the clone 45 degrees clockwise">&#8635;</button>
        <button id="clone-flip" title="Flip the clone left to right">&#8596;</button>
        <button id="clone-ok" title="Paste the clone where it is placed" hidden>&#10004;</button>
        <button id="clone-cancel" title="Cancel the clone">&#x1F5D9;</button>
      </div>
      <!-- the morph book, over the whole game window; a click outside the box closes it -->
      <div id="book" class="book" hidden>
        <div class="book-box" role="dialog" aria-label="Morph book">
          <h2 id="book-title">Dissolve to respawn</h2>
          <div class="book-grid" id="book-grid"></div>
          <button id="book-close">Close</button>
          <div id="book-species" class="book-species" hidden></div>
          <!-- sandbox mode: held for 3 s, clears the central inventory -->
          <div id="book-clear" class="book-clear" hidden title="Hold for 3 seconds to clear every discovered morph and bullet, from every run">Hold to clear data</div>
        </div>
      </div>
      <!-- "SUCCESS", centred over the game window when a line's [need] conditions are met, fading out -->
      <div id="success" class="success" hidden><div class="success-box">SUCCESS</div></div>
      <!-- a chapter's title card ([chapter]), over the whole game window -->
      <div id="chapter" class="chapter" hidden>
        <div class="chapter-box"><div class="chapter-no" id="chapter-no"></div><div class="chapter-title" id="chapter-title"></div></div>
      </div>
      <!-- in the ship view, between "Dissolved" and Upward / Zoom, when the world needs a reset (everything dissolved) -->
      <div class="ship-dead">
        <button id="reset" class="major" hidden title="Start again with your morph (Z)"><span class="kt">Respawn</span></button>
        <button id="morphs-dead" class="major" hidden title="Choose a morph to start again with (X)"><span class="kt">Choose</span></button>
      </div>
      <!-- the lower left corner of the world view, while the bullets are on ([bullet]); as X -->
      <!-- above Fire, while the gun has two or more patterns ([bullet]): the previous / next one (D / F) -->
      <div id="bullet-nav" class="bullet-nav" hidden>
        <button id="bullet-prev" title="The previous bullet pattern (D)">&#9664;</button>
        <button id="bullet-next" title="The next bullet pattern (F)">&#9654;</button>
      </div>
      <button id="fire" class="fire" hidden title="Fire a bullet the way the ship moves (A)"><span class="kt">Fire</span><span id="fire-id" class="fire-id" hidden></span></button>
      <div id="error" class="error" hidden></div>
    </div>
  </div>
  <!-- under the screen: the message area (under the world view), the controls (under the ship view) -->
  <div class="below">
    <div class="msg" id="msg" aria-live="polite"></div>
    <div class="controls">
      <button id="restart" title="Retry the scene: redo the script from its last checkpoint ([chapter] or [new_scene]) to here (Backspace)">Retry</button>
      <button id="play" aria-pressed="false" title="Play / pause (Enter)">Play</button>
      <label title="Simulation speed (Q slower, W faster)">Speed <input id="speed" type="range" min="1" max="7" step="1"></label>
    </div>
  </div>
</div>
<button id="fs-exit" class="fs-exit icon" title="Exit fullscreen" aria-label="Exit fullscreen">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
</button>

<script src="rule.js"></script>
<script src="aquarium233.js"></script>
<script src="species.js"></script>
<script src="creatures.js"></script>
<script src="glsim.js"></script>
<script src="statschart.js"></script>
<script src="detect.js"></script>
<script src="page.js"></script>
<script src="core.js"></script>
<script src="dots.js"></script>
<script src="bullet_patterns.js"></script>
<script src="bullets.js"></script>
<script src="game.js"></script>
</body>
</html>
